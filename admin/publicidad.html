<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · ROCIMAR ADS</title><style>
body{font:16px system-ui,Arial;background:#f6f3ed;color:#183748;margin:0}header{background:#17374b;color:white;padding:20px}main{max-width:950px;margin:auto;padding:20px}.panel{background:white;padding:22px;border-radius:12px;margin:18px 0;border:1px solid #e1ddd4}input,select,button{font:inherit;padding:10px;border-radius:6px}input,select{border:1px solid #b9c4ca;width:100%;box-sizing:border-box}label{display:block;margin:12px 0 5px;font-weight:600}button{border:0;background:#17374b;color:white;cursor:pointer;margin:12px 8px 0 0}.muted{color:#5e707a}.item{border-bottom:1px solid #ddd;padding:12px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}[hidden]{display:none!important}</style></head><body><header><h1>ROCIMAR ADS</h1><div>Panel privado de campañas publicitarias</div></header><main><p id="status" role="status"></p><section class="panel" id="login"><h2>Acceso administrativo</h2><form id="loginForm"><label>Contraseña de administración<input id="password" type="password" autocomplete="current-password" required></label><button>Entrar</button></form></section><div id="private" hidden><button id="logout">Cerrar sesión</button><section class="panel"><h2>Crear campaña</h2><form id="campaignForm"><label>Anunciante<input name="name" maxlength="100" required></label><label>Ubicación<select name="slot"><option value="home-top">Portada</option><option value="news-between">Noticias superior</option><option value="news-inline">Noticias interior</option><option value="news-sidebar">Artículo</option><option value="cabimas">Cabimas y su Gente</option></select></label><label>Enlace HTTPS<input name="url" type="url" required></label><label>Subir imagen PNG, JPG o WebP (máximo 1,4 MB)<input id="bannerFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="uploadBanner">Subir imagen permanente</button><label>Imagen HTTPS<input id="bannerUrl" name="image" type="url" required></label><label>Descripción<input name="alt" maxlength="140"></label><div class="grid"><label>Inicio<input name="start_at" type="datetime-local"></label><label>Final<input name="end_at" type="datetime-local"></label><label>Estado<select name="status"><option value="draft">Borrador</option><option value="paused">Pausado</option><option value="approved">Aprobado</option></select></label></div><button>Guardar campaña</button></form></section><section class="panel"><h2>Campañas y estadísticas (30 días)</h2><button id="refresh">Actualizar</button><div id="campaigns"></div></section></div></main><script>
const $=x=>document.getElementById(x);const api=async(action,method='GET',body,id)=>{const r=await fetch('/api/ads-admin?action='+encodeURIComponent(action)+(id?'&id='+encodeURIComponent(id):''),{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error((d.error||'Error de conexión')+(d.codigo?' · Código: '+d.codigo:''));return d};const msg=s=>$('status').textContent=s;
function show(ok){$('login').hidden=ok;$('private').hidden=!ok;if(ok)load()}
async function load(){try{const [data,stats]=await Promise.all([api('campaigns'),api('stats')]);const box=$('campaigns');box.replaceChildren();const counts=Object.fromEntries((stats.stats||[]).map(s=>[s.campaign_id,s]));for(const a of data.campaigns||[]){const d=document.createElement('div');d.className='item';const title=document.createElement('strong');title.textContent=a.name+' · '+a.slot;const sub=document.createElement('p');sub.className='muted';const st=counts[a.id]||{};sub.textContent=a.status+' · Impresiones: '+(st.impressions||0)+' · Clics: '+(st.clicks||0);const select=document.createElement('select');for(const x of ['draft','approved','paused']){const op=document.createElement('option');op.value=x;op.textContent=x;op.selected=x===a.status;select.append(op)}const destinationLabel=document.createElement('label');destinationLabel.textContent='Enlace HTTPS del anuncio';const destination=document.createElement('input');destination.type='url';destination.value=a.url||'';destination.required=true;destinationLabel.append(destination);const feedback=document.createElement('p');feedback.className='muted';feedback.setAttribute('role','status');const notify=s=>{feedback.textContent=s;msg(s)};const save=document.createElement('button');save.textContent='Actualizar estado';const saveLink=document.createElement('button');saveLink.textContent='Guardar enlace';saveLink.onclick=async()=>{try{const url=new URL(destination.value);if(url.protocol!=='https:')throw Error('El enlace debe comenzar con https://');await api('campaigns','PATCH',{name:a.name,slot:a.slot,url:url.href,image:a.image,alt:a.alt,status:a.status,start_at:a.start_at,end_at:a.end_at},a.id);a.url=url.href;notify('Enlace actualizado correctamente')}catch(e){notify('Error al guardar enlace: '+e.message)}};const replace=document.createElement('button');replace.textContent='Usar imagen subida';replace.onclick=async()=>{const image=$('bannerUrl').value;if(!image){notify('Primero sube la imagen con el botón de arriba');return}try{await api('campaigns','PATCH',{name:a.name,slot:a.slot,url:a.url,image,alt:a.alt,status:a.status,start_at:a.start_at,end_at:a.end_at},a.id);a.image=image;notify('Imagen actualizada correctamente. Estado conservado: '+a.status)}catch(e){notify('Error al actualizar imagen: '+e.message)}};save.onclick=async()=>{try{await api('campaigns','PATCH',{name:a.name,slot:a.slot,url:a.url,image:a.image,alt:a.alt,status:select.value,start_at:a.start_at,end_at:a.end_at},a.id);a.status=select.value;sub.textContent=a.status+' · Impresiones: '+(st.impressions||0)+' · Clics: '+(st.clicks||0);notify('Estado actualizado correctamente')}catch(e){notify('Error al actualizar estado: '+e.message)}};d.append(title,sub,destinationLabel,saveLink,select,save,replace,feedback);box.append(d)}if(!data.campaigns?.length)box.textContent='No hay campañas todavía.'}catch(e){msg(e.message)}}
$('uploadBanner').onclick=async()=>{const file=$('bannerFile').files[0];if(!file){msg('Selecciona una imagen');return}if(file.size>1400000){msg('La imagen supera 1,4 MB; reduce su tamaño antes de subirla');return}try{msg('Subiendo imagen...');const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=reject;reader.readAsDataURL(file)});const result=await api('upload','POST',{mime:file.type,data});$('bannerUrl').value=result.url;msg('Imagen permanente subida. Ahora puedes guardar la campaña.')}catch(e){msg(e.message)}};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('login','POST',{password:$('password').value});$('password').value='';msg('Sesión iniciada');show(true)}catch(e){msg(e.message)}};
$('campaignForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const x=Object.fromEntries(f.entries());for(const k of ['start_at','end_at'])x[k]=x[k]?new Date(x[k]).toISOString():null;try{await api('campaigns','POST',x);e.target.reset();msg('Campaña guardada');load()}catch(err){msg(err.message)}};
$('refresh').onclick=load;$('logout').onclick=async()=>{try{await api('logout','POST');show(false);msg('Sesión cerrada')}catch(e){msg(e.message)}};
api('session').then(()=>show(true)).catch(()=>show(false));
</script></body></html>
